<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#c25914" />
  <title>Family Recipe Book</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #faf5ef;
      --card: #ffffff;
      --ink: #241911;
      --muted: #6b5a4d;
      --accent: #c25914;
      --accent-dark: #9e450b;
      --border: #e6d8c8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .actions { display: flex; gap: 8px; }
    button {
      font: inherit;
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--ink);
      padding: 8px 12px;
    }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }
    button.primary:hover { background: var(--accent-dark); }
    .container { max-width: 820px; margin: 0 auto; padding: 16px; }
    .search {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 1rem;
      margin-bottom: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .recipe-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }
    .recipe-card h3 { margin: 0 0 6px; font-size: 1.1rem; }
    .meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }
    .card-btns { display: flex; gap: 8px; margin-top: 10px; }
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 30;
    }
    .backdrop.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      border: 1px solid var(--border);
    }
    label { display: block; font-weight: 600; margin-top: 10px; font-size: 0.9rem; }
    input, textarea, select {
      width: 100%;
      margin-top: 4px;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font: inherit;
    }
    textarea { min-height: 100px; resize: vertical; }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }
    .menu-box {
      position: fixed;
      top: 58px;
      right: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      padding: 6px;
      display: none;
      flex-direction: column;
      z-index: 25;
      min-width: 190px;
    }
    .menu-box.open { display: flex; }
    .menu-box button {
      border: none;
      text-align: left;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .menu-box button:hover { background: var(--bg); }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      display: none;
      z-index: 40;
    }
    .toast.show { display: block; }
    img.thumb {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span>📖</span><span>Family Recipe Book</span></div>
    <div class="actions">
      <button type="button" id="addBtn" class="primary">+ Add</button>
      <button type="button" id="menuBtn" aria-label="Menu">☰</button>
    </div>
  </header>

  <div id="menuBox" class="menu-box">
    <button type="button" id="exportBtn">Export Backup (.json)</button>
    <button type="button" id="importBtn">Import Backup (.json)</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none" />
  </div>

  <main class="container">
    <input type="search" id="searchInput" class="search" placeholder="Search recipes or ingredients (e.g., garlic, beef)..." />
    <div id="recipeGrid" class="grid"></div>
  </main>

  <div id="formBackdrop" class="backdrop">
    <div class="modal">
      <h2 id="formTitle" style="margin:0 0 6px;">Add Recipe</h2>
      <form id="recipeForm">
        <input type="hidden" id="editId" />
        <label>Title <input type="text" id="rTitle" required /></label>
        <label>Category
          <select id="rCategory">
            <option>Mains</option>
            <option>Sides</option>
            <option>Desserts</option>
            <option>Breakfast</option>
            <option>Other</option>
          </select>
        </label>
        <label>Time & Yield <input type="text" id="rMeta" placeholder="e.g., 25 min · 18 servings" /></label>
        <label>Photo <input type="file" id="rPhoto" accept="image/*" /></label>
        <label>Ingredients (one per line) <textarea id="rIngredients"></textarea></label>
        <label>Instructions (one step per line) <textarea id="rSteps"></textarea></label>
        <div class="modal-footer">
          <button type="button" id="cancelFormBtn">Cancel</button>
          <button type="submit" class="primary">Save Recipe</button>
        </div>
      </form>
    </div>
  </div>

  <div id="viewBackdrop" class="backdrop">
    <div class="modal" id="viewModal"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEY = "family_recipe_book_v1";
    let recipes = [];
    let pendingPhotoData = "";

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.remove("show"), 2400);
    }

    function loadRecipes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        recipes = raw ? JSON.parse(raw) : [];
      } catch (e) {
        recipes = [];
      }
    }

    function saveRecipes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
    }

    function compressImage(file, cb) {
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const maxW = 900;
          const scale = img.width > maxW ? maxW / img.width : 1;
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          cb(canvas.toDataURL("image/jpeg", 0.78));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function renderRecipes() {
      const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
      const grid = document.getElementById("recipeGrid");
      const filtered = recipes.filter(r => {
        if (!q) return true;
        const hay = [
          r.title || "",
          r.category || "",
          r.meta || "",
          (r.ingredients || []).join(" "),
          (r.steps || []).join(" ")
        ].join(" ").toLowerCase();
        return hay.includes(q);
      });

      if (!filtered.length) {
        grid.innerHTML = '<p style="color:#6b5a4d;">No recipes yet. Tap <strong>+ Add</strong> to add one.</p>';
        return;
      }

      grid.innerHTML = filtered.map(r => `
        <article class="recipe-card">
          ${r.photo ? `<img class="thumb" src="${r.photo}" alt="${escapeHtml(r.title)}" />` : ""}
          <h3>${escapeHtml(r.title)}</h3>
          <div class="meta">${escapeHtml(r.category || "Other")}${r.meta ? " · " + escapeHtml(r.meta) : ""}</div>
          <div class="card-btns">
            <button type="button" onclick="openView('${r.id}')">Open</button>
            <button type="button" onclick="openEdit('${r.id}')">Edit</button>
            <button type="button" onclick="deleteRecipe('${r.id}')">Delete</button>
          </div>
        </article>
      `).join("");
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function openAdd() {
      document.getElementById("menuBox").classList.remove("open");
      document.getElementById("formTitle").textContent = "Add Recipe";
      document.getElementById("editId").value = "";
      document.getElementById("recipeForm").reset();
      pendingPhotoData = "";
      document.getElementById("formBackdrop").classList.add("open");
    }

    function openEdit(id) {
      const r = recipes.find(item => item.id === id);
      if (!r) return;
      document.getElementById("formTitle").textContent = "Edit Recipe";
      document.getElementById("editId").value = r.id;
      document.getElementById("rTitle").value = r.title || "";
      document.getElementById("rCategory").value = r.category || "Mains";
      document.getElementById("rMeta").value = r.meta || "";
      document.getElementById("rIngredients").value = (r.ingredients || []).join("\n");
      document.getElementById("rSteps").value = (r.steps || []).join("\n");
      pendingPhotoData = r.photo || "";
      document.getElementById("rPhoto").value = "";
      document.getElementById("formBackdrop").classList.add("open");
    }

    function openView(id) {
      const r = recipes.find(item => item.id === id);
      if (!r) return;
      const modal = document.getElementById("viewModal");
      modal.innerHTML = `
        <h2 style="margin:0 0 6px;">${escapeHtml(r.title)}</h2>
        <div class="meta">${escapeHtml(r.category || "Other")}${r.meta ? " · " + escapeHtml(r.meta) : ""}</div>
        ${r.photo ? `<img class="thumb" style="height:220px;" src="${r.photo}" alt="${escapeHtml(r.title)}" />` : ""}
        <h4>Ingredients</h4>
        <ul>${(r.ingredients || []).map(i => `<li>${escapeHtml(i)}</li>`).join("")}</ul>
        <h4>Instructions</h4>
        <ol>${(r.steps || []).map(s => `<li>${escapeHtml(s)}</li>`).join("")}</ol>
        <div class="modal-footer">
          <button type="button" id="closeViewBtn" class="primary">Close</button>
        </div>
      `;
      document.getElementById("closeViewBtn").onclick = () => {
        document.getElementById("viewBackdrop").classList.remove("open");
      };
      document.getElementById("viewBackdrop").classList.add("open");
    }

    function deleteRecipe(id) {
      recipes = recipes.filter(r => r.id !== id);
      saveRecipes();
      renderRecipes();
      showToast("Recipe deleted");
    }

    document.getElementById("addBtn").addEventListener("click", openAdd);
    document.getElementById("menuBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      document.getElementById("menuBox").classList.toggle("open");
    });
    document.addEventListener("click", () => {
      document.getElementById("menuBox").classList.remove("open");
    });

    document.getElementById("cancelFormBtn").addEventListener("click", () => {
      document.getElementById("formBackdrop").classList.remove("open");
    });

    document.getElementById("rPhoto").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      compressImage(file, (dataUrl) => {
        pendingPhotoData = dataUrl;
      });
    });

    document.getElementById("recipeForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const id = document.getElementById("editId").value || String(Date.now());
      const existing = recipes.find(r => r.id === id);
      const entry = {
        id,
        title: document.getElementById("rTitle").value.trim(),
        category: document.getElementById("rCategory").value,
        meta: document.getElementById("rMeta").value.trim(),
        ingredients: document.getElementById("rIngredients").value.split("\n").map(s => s.trim()).filter(Boolean),
        steps: document.getElementById("rSteps").value.split("\n").map(s => s.trim()).filter(Boolean),
        photo: pendingPhotoData || (existing ? existing.photo : "")
      };
      if (existing) {
        recipes = recipes.map(r => r.id === id ? entry : r);
      } else {
        recipes.unshift(entry);
      }
      saveRecipes();
      renderRecipes();
      document.getElementById("formBackdrop").classList.remove("open");
      showToast("Recipe saved");
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(recipes, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "family-recipes-backup.json";
      a.click();
      URL.revokeObjectURL(url);
      showToast("Backup exported");
    });

    document.getElementById("importBtn").addEventListener("click", () => {
      document.getElementById("importFile").click();
    });

    document.getElementById("importFile").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (Array.isArray(parsed)) {
            recipes = parsed;
            saveRecipes();
            renderRecipes();
            showToast("Backup imported");
          }
        } catch (err) {
          showToast("Invalid backup file");
        }
      };
      reader.readAsText(file);
    });

    document.getElementById("searchInput").addEventListener("input", renderRecipes);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }

    loadRecipes();
    renderRecipes();
  </script>
</body>
</html>
